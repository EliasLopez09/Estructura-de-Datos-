<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking - Arcade Fight Fest</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #111;
      color: white;
    }
    h1 {
      text-align: center;
      color: #f7c600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #222;
      color: white;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    th {
      background-color: #333;
    }
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      th {
        position: absolute;
        left: -9999px;
      }
      td {
        position: relative;
        padding-left: 50%;
      }
      td::before {
        position: absolute;
        left: 10px;
        width: 45%;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <h1>Ranking - Arcade Fight Fest</h1>
  <table id="ranking">
    <thead>
      <tr><th>#</th><th>Participante</th><th>Puntaje</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Reemplaza con tu URL CSV publicada desde Google Sheets
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlQjQfQX5_oufrC06k_4PNJFB1FNWAdXSIRpaFQJpIupuP_FWQAhYAesJZwUqOrENVC8cTs7sX-Z2a/pub?gid=0&single=true&output=csv';

    fetch(CSV_URL)
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').slice(1); // Quita encabezado
        const parsed = rows.map(r => r.split(',')).filter(row => row[0] && row[1]);

        // Ordenar por puntaje (suponiendo columna 2 es puntaje)
        parsed.sort((a, b) => Number(b[1]) - Number(a[1]));

        const tbody = document.querySelector('#ranking tbody');
        parsed.forEach((row, index) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${index + 1}</td><td>${row[0]}</td><td>${row[1]}</td>`;
          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
